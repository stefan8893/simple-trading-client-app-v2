name: Continuous Deployment

on:
  push:
    tags: ['**']

jobs:
  metadata:
    name: Extract Version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - name: Extract version from tag
        id: extract_version
        run: |
          $Version = $env:GITHUB_REF -replace 'refs/tags/', ''
          Write-Host "Version: $Version"
          echo "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Validate SemVer version
        run: |
          $Version = "${{ steps.extract_version.outputs.version }}"

          if ($Version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$') {
            Write-Error "Version '$Version' is not a valid SemVer."
            EXIT -1
          } else {
            Write-Host "Version '$Version' is a valid SemVer. "
          }

  publish:
    name: Publish App
    runs-on: ubuntu-latest
    needs: metadata
    environment:
      name: production
    permissions:
      id-token: write
      packages: read
      contents: read

    env:
      Version: ${{ needs.metadata.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install packages
        run: npm ci

      - name: Audit packages
        run: npm audit --audit-level=high

      - name: Lint
        env:
          CI: true
        run: npm run lint

      - name: Build
        run: |
          npm version ${{ needs.metadata.outputs.version }} --allow-same-version --no-git-tag-version
          npm run build

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy client app
        uses: azure/CLI@v3
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob delete-batch --account-name "$CLIENT_APP_STORAGE_ACCOUNT" --source '$web' --auth-mode login
            az storage blob upload-batch --account-name "$CLIENT_APP_STORAGE_ACCOUNT" --destination '$web' --source ./dist --overwrite --auth-mode login

            # set cache-control header for index.html only by re-uploading it with the --content-cache option
            az storage blob upload --account-name "$CLIENT_APP_STORAGE_ACCOUNT" --container-name '$web' --file ./dist/index.html --name index.html --content-cache 'no-cache' --overwrite --auth-mode login
        env:
          CLIENT_APP_STORAGE_ACCOUNT: ${{ vars.CLIENT_APP_STORAGE_ACCOUNT }}
