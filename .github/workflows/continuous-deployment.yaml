name: Continuous Deployment

on:
  push:
    tags: ['**']

jobs:
  metadata:
    name: Extract Version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - name: Extract version from tag
        id: extract_version
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $Version = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            Write-Host "No version found. Use default version instead."
            $Version = "0.0.0"
          }

          Write-Host "Version: $Version"
          echo "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Validate SemVer version
        run: |
          $Version = "${{ steps.extract_version.outputs.version }}"

          if ($Version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$') {
            Write-Error "Version '$Version' is not a valid SemVer."
            EXIT -1
          } else {
            Write-Host "Version '$Version' is a valid SemVer. "
          }

  shared:
    uses: ./.github/workflows/shared-build.yaml
    needs: metadata
    with:
      node-version: '24'
      app-version: "${{ needs.metadata.outputs.version }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [metadata, shared]
    steps:
      - name: Deploy new Version here ...
        shell: pwsh
        run: |
          $Version = "${{ needs.metadata.outputs.version }}"
          Write-Host "Deploy Version $Version"