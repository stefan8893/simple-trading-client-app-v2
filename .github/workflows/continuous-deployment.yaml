name: Continuous Deployment

on:
  push:
    tags: ['**']

jobs:
  shared:
    uses: ./.github/workflows/shared-build.yaml
    with:
      node-version: '24'

  deploy:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - name: Deploy new Version here ...
        shell: pwsh
        run: |
          $Version = "${{ needs.shared.outputs.version }}"
          Write-Host "Deploy Version $Version"